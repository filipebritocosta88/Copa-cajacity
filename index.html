<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metasboard - Logística Integrada</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --light: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
        }

        /* Sidebar Estilizada */
        .sidebar {
            width: 250px;
            height: 100vh;
            background: var(--primary);
            color: white;
            position: fixed;
            padding: 20px;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            text-align: center;
            border-bottom: 1px solid var(--secondary);
            padding-bottom: 20px;
        }

        .menu-item {
            padding: 15px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item:hover {
            background: var(--accent);
            border-radius: 8px;
        }

        /* Área Principal */
        .main-content {
            margin-left: 290px;
            padding: 30px;
            width: calc(100% - 320px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }

        .stat-card i { font-size: 2rem; color: var(--accent); margin-bottom: 10px; }
        .stat-card h3 { margin: 0; color: #7f8c8d; font-size: 0.9rem; }
        .stat-card p { font-size: 1.5rem; font-weight: bold; margin: 10px 0 0; }

        /* Formulário de Solicitação */
        .form-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            background: var(--success);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        button:hover { opacity: 0.9; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
        }

        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: var(--light); color: var(--primary); }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>METASBOARD LOG</h2>
        <div class="menu-item"><i class="fas fa-plus"></i> Nova Solicitação</div>
        <div class="menu-item"><i class="fas fa-exchange-alt"></i> Reversas Ativas</div>
        <div class="menu-item"><i class="fas fa-motorcycle"></i> Motoboys (DT)</div>
        <div class="menu-item"><i class="fas fa-chart-line"></i> Relatório Financeiro</div>
        <div class="menu-item"><i class="fas fa-users"></i> Influencers</div>
    </div>

    <div class="main-content">
        <h1>Painel de Controle Logístico</h1>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-boxes"></i>
                <h3>Pedidos E-commerce</h3>
                <p id="count-ecom">0</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-undo"></i>
                <h3>Reversas Pendentes</h3>
                <p id="count-reversa">0</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-shipping-fast"></i>
                <h3>Envios Hoje</h3>
                <p id="count-today">0</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-dollar-sign"></i>
                <h3>Gasto Estimado (Mês)</h3>
                <p id="total-cost">R$ 0,00</p>
            </div>
        </div>

        <div class="form-container">
            <h3>Nova Solicitação de Envio / Reversa</h3>
            <form id="logistics-form">
                <div class="form-group">
                    <select id="setor" required>
                        <option value="">Setor Solicitante</option>
                        <option value="ADM">Administrativo</option>
                        <option value="Call Center">Call Center</option>
                        <option value="DT">DT (Venda Salvador)</option>
                        <option value="Gerência">Gerência Loja</option>
                    </select>
                    <select id="tipo" required>
                        <option value="">Tipo de Serviço</option>
                        <option value="Reversa">Logística Reversa</option>
                        <option value="Sedex">Sedex</option>
                        <option value="PAC">PAC</option>
                        <option value="Motoboy">Motoboy Interno</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="text" id="origem" placeholder="Cidade Origem" required>
                    <input type="text" id="destino" placeholder="Cidade Destino" required>
                </div>
                <div class="form-group">
                    <input type="text" id="responsavel" placeholder="Responsável/Influencer">
                    <input type="number" id="valor" placeholder="Custo Estimado (R$)" step="0.01">
                </div>
                <textarea id="obs" placeholder="Observações (Motivo do envio, Link do pedido, etc)"></textarea>
                <button type="submit">Registrar Solicitação</button>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Setor</th>
                    <th>Tipo</th>
                    <th>Trajeto</th>
                    <th>Custo</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Dados inseridos via JS -->
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
