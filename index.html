<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGISTICA - Metasboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a2a6c;
            --secondary: #2c3e50;
            --accent: #00d2ff;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            color: var(--secondary);
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            height: 100vh;
            background: var(--primary);
            color: white;
            position: fixed;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h2 {
            font-size: 1.5rem;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
            letter-spacing: 2px;
        }

        /* Painel Principal */
        .container {
            margin-left: 260px;
            padding: 30px;
            width: 100%;
            max-width: 1400px;
        }

        /* Dashboard Cards */
        .dash-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-left: 5px solid var(--accent);
        }

        .card h3 { font-size: 0.85rem; text-transform: uppercase; margin-top: 0; color: #7f8c8d; }
        .card .value { font-size: 1.8rem; font-weight: bold; margin: 10px 0; }

        /* Formulário */
        .form-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group { position: relative; }
        
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: 600; }
        
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus { border-color: var(--accent); }

        .suggestions {
            position: absolute;
            background: white;
            border: 1px solid #ddd;
            width: 100%;
            z-index: 100;
            max-height: 150px;
            overflow-y: auto;
            border-radius: 0 0 6px 6px;
            display: none;
        }

        .suggestions div {
            padding: 10px;
            cursor: pointer;
        }

        .suggestions div:hover { background: #f0f0f0; }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }

        .btn-submit:hover { background: var(--secondary); }

        /* Tabela */
        .table-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 15px; text-align: left; font-size: 0.9rem; }
        td { padding: 15px; border-top: 1px solid #eee; font-size: 0.9rem; }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-pendente { background: #ffeaa7; color: #d6a316; }
        .status-finalizado { background: #55efc4; color: #00b894; }

        .modal-logistica {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            z-index: 1000;
            border-radius: 12px;
            width: 400px;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>LOGISTICA</h2>
        <p style="text-align: center; font-size: 0.8rem; opacity: 0.7;">Metasboard v1.0</p>
        <hr style="opacity: 0.1; margin: 20px 0;">
        <div style="padding: 10px;"><i class="fas fa-home"></i> Painel Geral</div>
        <div style="padding: 10px;"><i class="fas fa-file-export"></i> Exportar Mensal</div>
    </div>

    <div class="container">
        <!-- Dashboard -->
        <div class="dash-cards">
            <div class="card">
                <h3>Pedidos</h3>
                <div class="value" id="card-pedidos">0</div>
            </div>
            <div class="card" style="border-left-color: var(--warning);">
                <h3>Reversas Pendentes</h3>
                <div class="value" id="card-reversas">0</div>
            </div>
            <div class="card" style="border-left-color: var(--success);">
                <h3>Envios Hoje</h3>
                <div class="value" id="card-hoje">0</div>
            </div>
            <div class="card" style="border-left-color: var(--danger);">
                <h3>Gasto Estimado (Mês)</h3>
                <div class="value" id="card-gasto">R$ 0,00</div>
            </div>
        </div>

        <!-- Formulário -->
        <div class="form-section">
            <h3 style="margin-top:0"><i class="fas fa-plus-circle"></i> Nova Solicitação de Envio / Reversa</h3>
            <form id="form-solicitacao">
                <div class="grid-inputs">
                    <!-- Setor -->
                    <div class="input-group">
                        <label>Setor Solicitante (Opcional)</label>
                        <input type="text" id="input-setor" placeholder="Ex: ADM, Call Center..." onkeyup="filtrarSetor()">
                        <div id="sugestoes-setor" class="suggestions"></div>
                    </div>

                    <!-- Responsável -->
                    <div class="input-group">
                        <label>Responsável Solicitante</label>
                        <input type="text" id="input-responsavel" placeholder="Digite o nome..." onkeyup="filtrarResponsavel()">
                        <div id="sugestoes-resp" class="suggestions"></div>
                    </div>

                    <!-- Tipo -->
                    <div class="input-group">
                        <label>Tipo de Envio</label>
                        <select id="select-tipo" required>
                            <option value="Sedex">Sedex</option>
                            <option value="PAC">PAC</option>
                            <option value="Uber Corporativo">Uber Corporativo</option>
                            <option value="Motoboy Interno">Motoboy Interno</option>
                            <option value="Transportadora">Transportadora</option>
                        </select>
                    </div>
                </div>

                <div class="grid-inputs">
                    <input type="text" id="resp-nome" placeholder="Nome Completo" required>
                    <input type="text" id="resp-cidade" placeholder="Cidade Origem" required>
                    <input type="text" id="resp-cpf" placeholder="CPF">
                </div>
                
                <div class="grid-inputs">
                    <input type="email" id="resp-email" placeholder="E-mail">
                    <input type="text" id="destino" placeholder="Cidade Destino (ou selecione p/ preencher)" onkeyup="filtrarDestino()">
                    <div id="sugestoes-destino" class="suggestions" style="top: 40px;"></div>
                </div>

                <button type="submit" class="btn-submit">Registrar e Notificar Logística</button>
            </form>
        </div>

        <!-- Tabela -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Setor/Responsável</th>
                        <th>Tipo</th>
                        <th>Origem > Destino</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="lista-solicitacoes"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal Logística -->
    <div class="overlay" id="overlay"></div>
    <div class="modal-logistica" id="modal-logistica">
        <h3>Finalizar Solicitação (Setor Logística)</h3>
        <input type="hidden" id="edit-id">
        <label>Código de Rastreio</label>
        <input type="text" id="log-rastreio" style="margin-bottom:15px">
        <label>Custo do Envio (R$)</label>
        <input type="number" id="log-custo" step="0.01" style="margin-bottom:15px">
        <label>Previsão de Entrega</label>
        <input type="date" id="log-previsao" style="margin-bottom:15px">
        <label>Anexar Comprovante (URL/Caminho)</label>
        <input type="text" id="log-anexo" style="margin-bottom:20px">
        <button onclick="salvarLogistica()" class="btn-submit">Finalizar e Devolver ao Responsável</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
